name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tkt
          POSTGRES_PASSWORD: tkt
          POSTGRES_DB: tkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tkt -d tkt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      DIRECT_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      TEST_DATABASE_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      JWT_SECRET: ci-test-staff-secret-not-for-production
      SMTP_ENABLED: "false"
      TKT_RATE_LIMIT_TEST: "false"
      PUBLIC_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Commit generated npm lockfile (feature branch bootstrap only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/custom-ticket-experience-wallet'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(wallet): sync passkit-generator lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Generate Prisma client
        run: npm run generate
      - name: Generate ephemeral Ed25519 credential keys
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { generateKeyPairSync } from 'node:crypto'
          const pair = generateKeyPairSync('ed25519')
          const privateKey = Buffer.from(pair.privateKey.export({ type: 'pkcs8', format: 'pem' })).toString('base64url')
          const publicKey = Buffer.from(pair.publicKey.export({ type: 'spki', format: 'pem' })).toString('base64url')
          appendFileSync(process.env.GITHUB_ENV, 'CREDENTIAL_PRIVATE_KEY_B64=' + privateKey + String.fromCharCode(10) + 'CREDENTIAL_PUBLIC_KEY_B64=' + publicKey + String.fromCharCode(10))
          NODE
      - name: Type check
        run: npm run typecheck
      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate staged load-test script syntax
        run: node --check tests/load/reservations.js
