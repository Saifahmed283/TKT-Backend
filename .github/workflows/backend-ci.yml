name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tkt
          POSTGRES_PASSWORD: tkt
          POSTGRES_DB: tkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tkt -d tkt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      DIRECT_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      TEST_DATABASE_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      JWT_SECRET: ci-test-staff-secret-not-for-production
      SMTP_ENABLED: "false"
      TKT_RATE_LIMIT_TEST: "false"
      PUBLIC_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run generate
      - name: Generate ephemeral Ed25519 credential keys
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { generateKeyPairSync } from 'node:crypto'
          const pair = generateKeyPairSync('ed25519')
          const privateKey = Buffer.from(pair.privateKey.export({ type: 'pkcs8', format: 'pem' })).toString('base64url')
          const publicKey = Buffer.from(pair.publicKey.export({ type: 'spki', format: 'pem' })).toString('base64url')
          appendFileSync(process.env.GITHUB_ENV, 'CREDENTIAL_PRIVATE_KEY_B64=' + privateKey + String.fromCharCode(10) + 'CREDENTIAL_PUBLIC_KEY_B64=' + publicKey + String.fromCharCode(10))
          NODE
      - name: Type check
        run: npm run typecheck
      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Sign and verify an Apple Wallet pass with temporary CI certificates
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tmpdir/wwdr.key" -out "$tmpdir/wwdr.pem" -days 30 -subj "/CN=TKT Temporary CI WWDR" >/dev/null 2>&1
          openssl genrsa -out "$tmpdir/signer.key" 2048 >/dev/null 2>&1
          openssl req -new -key "$tmpdir/signer.key" -out "$tmpdir/signer.csr" -subj "/CN=TKT Temporary CI Pass Signer" >/dev/null 2>&1
          openssl x509 -req -in "$tmpdir/signer.csr" -CA "$tmpdir/wwdr.pem" -CAkey "$tmpdir/wwdr.key" -CAcreateserial -out "$tmpdir/signer.pem" -days 30 -sha256 >/dev/null 2>&1
          export APPLE_WALLET_PASS_TYPE_IDENTIFIER="pass.com.example.tkt"
          export APPLE_WALLET_TEAM_IDENTIFIER="TEAM123456"
          export APPLE_WALLET_ORGANIZATION_NAME="TKT CI"
          export APPLE_WALLET_SIGNER_CERTIFICATE_B64="$(base64 -w0 "$tmpdir/signer.pem")"
          export APPLE_WALLET_SIGNER_KEY_B64="$(base64 -w0 "$tmpdir/signer.key")"
          export APPLE_WALLET_WWDR_CERTIFICATE_B64="$(base64 -w0 "$tmpdir/wwdr.pem")"
          node scripts/wallet-pass-smoke.mjs
      - name: Validate staged load-test script syntax
        run: node --check tests/load/reservations.js
