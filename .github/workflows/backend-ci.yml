name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tkt
          POSTGRES_PASSWORD: tkt
          POSTGRES_DB: tkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tkt -d tkt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      DIRECT_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      TEST_DATABASE_URL: postgresql://tkt:tkt@localhost:5432/tkt_test?schema=public
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      JWT_SECRET: ci-test-staff-secret-not-for-production
      SMTP_ENABLED: "false"
      TKT_RATE_LIMIT_TEST: "false"
      PUBLIC_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run generate
      - name: Type check
        run: npm run typecheck
      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Integration tests
        run: npm test
      - name: Production build
        run: npm run build
