name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://ci:ci@127.0.0.1:5432/tkt_ci?schema=public' }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      HAS_TEST_DATABASE: ${{ secrets.TEST_DATABASE_URL != '' }}
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      JWT_SECRET: ci-test-staff-secret-not-for-production
      SMTP_ENABLED: "false"
      TKT_RATE_LIMIT_TEST: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run generate
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Integration tests (dedicated test database only)
        if: env.HAS_TEST_DATABASE == 'true'
        run: npm test
      - name: Explain skipped integration tests
        if: env.HAS_TEST_DATABASE != 'true'
        run: echo "Skipped: configure TEST_DATABASE_URL with a dedicated, non-production test database."
